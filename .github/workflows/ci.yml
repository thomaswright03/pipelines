name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    env:
      # `prisma generate` (this project's postinstall) only needs this var
      # to resolve, never an actual connection — CI never talks to a real
      # database.
      PIPELINES_DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skips the `prisma generate` postinstall step's need for a real
      # database — it only reads prisma/schema.prisma, never connects.
      - run: npm ci

      # `next build` runs the real TypeScript check itself — a bare `tsc
      # --noEmit` misses Next's generated route types (LayoutProps etc.),
      # which only exist after a build has run at least once. Confirmed
      # this needs no real secrets, only the dummy PIPELINES_DIRECT_URL
      # above — instrumentation.ts's env validation only runs when a
      # server actually starts, not at build time.
      - run: npm run build

      - run: npm run lint
