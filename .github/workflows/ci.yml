name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skips the `prisma generate` postinstall step's need for a real
      # database — it only reads prisma/schema.prisma, never connects.
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint
