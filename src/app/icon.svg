<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The header's "O" mark (layout.tsx): the brand indigo (indigo-500 to indigo-900, as themed in globals.css), an ivory-gold O and a gold edge. A filled tile, so it reads on light and dark tab bars alike. -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b60d7"/>
      <stop offset="1" stop-color="#1f2156"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#mark)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#d6b16a" stroke-opacity="0.5"/>
  <ellipse cx="16" cy="16" rx="6.6" ry="7.8" fill="none" stroke="#f3e3bf" stroke-width="3.4"/>
</svg>
